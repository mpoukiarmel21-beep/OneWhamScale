name: Build OneWhamScale Anti-Detect DEB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        lfs: true
    
    - name: Install dependencies
      run: |
        brew install ldid

    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
    
    - name: Compile tweak package
      run: |
        make clean
        make package
    
    - name: Locate DEB package
      run: |
        DEB_PATH=$(find packages -name "*.deb" | head -1)
        if [ -z "$DEB_PATH" ]; then
          echo "ERROR: .deb package not found"
          exit 1
        fi
        echo "DEB_PATH=$DEB_PATH"
        ls -la "$DEB_PATH"
        echo "deb_path=$DEB_PATH" >> $GITHUB_ENV
    
    - name: Copy DEB to workspace
      run: |
        cp "$deb_path" OneWhamScale_AntiDetect_v4.0.0.deb
        ls -la OneWhamScale_AntiDetect_v4.0.0.deb
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: OneWhamScale_AntiDetect_v4.0.0.deb
        tag_name: v4.0.0-${{ github.run_number }}
        name: OneWhamScale v4.0.0 DEB Build ${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}