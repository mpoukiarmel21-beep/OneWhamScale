name: Build OneWhamScale

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          export THEOS=$HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make package
          echo "Tweak .deb prêt:"
          ls -lh packages/*.deb

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: OneWhamScale_v1.0.0
          path: packages/*.deb
          retention-days: 30

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: "OneWhamScale v1.0.0 build ${{ github.run_number }}"
          artifacts: "packages/*.deb"
          token: ${{ secrets.GITHUB_TOKEN }}