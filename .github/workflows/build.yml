name: Build OneWhamScale IPA

on:
  workflow_dispatch:
    inputs:
      tinder_ipa_url:
        description: 'URL du Tinder IPA (optionnel)'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install Dependencies
        run: |
          brew install ldid
          brew install insert_dylib 2>/dev/null || true

      - name: Build OneWhamScale.dylib
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make package || true
          ls -la .theos/obj/debug/ 2>/dev/null || true

      - name: Download Tinder IPA
        run: |
          if [ -n "${{ github.event.inputs.tinder_ipa_url }}" ]; then
            curl -L "${{ github.event.inputs.tinder_ipa_url }}" -o Tinder.ipa
          else
            echo "Pas de URL fournie. Mettez un Tinder.ipa dans le repo ou upload manuel"
            exit 1
          fi

      - name: Build IPA
        run: |
          chmod +x build.sh
          ./build.sh --ipa Tinder.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OneWhamScale_IPA_${{ github.run_number }}
          path: output/*.ipa
          retention-days: 30

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ipa-${{ github.run_number }}
          name: "OneWhamScale IPA build ${{ github.run_number }}"
          artifacts: "output/*.ipa"
          token: ${{ secrets.GITHUB_TOKEN }}