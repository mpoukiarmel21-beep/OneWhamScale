name: Build OneWhamScale

on:
  workflow_dispatch:
    inputs:
      twofa_code:
        description: '2FA Code (6 digits, optional - only if ipatool asks)'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        brew install ldid
        brew install ipatool
        
    - name: Build insert_dylib
      run: |
        git clone https://github.com/tyilo/insert_dylib.git
        cd insert_dylib
        xcodebuild -project insert_dylib.xcodeproj -configuration Release
        sudo cp build/Release/insert_dylib /usr/local/bin/
        cd ..
        
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        
    - name: Download latest Tinder IPA
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        TWOFA_CODE: ${{ github.event.inputs.twofa_code }}
      run: |
        echo "Attempting to download Tinder IPA..."
        
        # Login with app-specific password
        if [ -n "$TWOFA_CODE" ]; then
          echo "2FA code provided, using interactive mode"
          expect -c "
            spawn ipatool auth login --email \"$APPLE_ID\" --password \"$APPLE_PASSWORD\"
            expect \"enter 2FA code:\"
            send \"$TWOFA_CODE\r\"
            expect eof
          " 2>&1 || echo "Login failed, trying download anyway"
        else
          echo "No 2FA code provided, attempting direct login"
          ipatool auth login --email "$APPLE_ID" --password "$APPLE_PASSWORD" 2>&1 || echo "Login failed"
        fi
        
        # Try to download
        ipatool download --bundle-id com.cardify.tinder --output Tinder.ipa 2>&1 || \
        ipatool download --bundle-id com.tinder.tinder --output Tinder.ipa 2>&1
        
        if [ ! -f Tinder.ipa ]; then
          echo "ERROR: Tinder.ipa not downloaded"
          exit 1
        fi
        
        echo "✓ Tinder.ipa downloaded successfully"
        ls -la Tinder.ipa
        
    - name: Compile tweak
      run: |
        make clean
        make package
        
    - name: Extract IPA
      run: |
        mkdir -p extracted
        unzip -q Tinder.ipa -d extracted
        
    - name: Inject dylib
      run: |
        DYLIB_PATH=$(find .theos/obj -name "*.dylib" | head -1)
        if [ -z "$DYLIB_PATH" ]; then
          echo "ERROR: dylib not found"
          exit 1
        fi
        cp "$DYLIB_PATH" extracted/Payload/Tinder.app/Frameworks/
        insert_dylib --inplace --all-yes "@executable_path/Frameworks/$(basename $DYLIB_PATH)" extracted/Payload/Tinder.app/Tinder
        
    - name: Remove code signature
      run: |
        rm -rf extracted/Payload/Tinder.app/_CodeSignature
        
    - name: Fake sign with ldid
      run: |
        ldid -S extracted/Payload/Tinder.app/Tinder
        
    - name: Repackage IPA
      run: |
        cd extracted
        zip -qr ../OneWhamScale_TinderPlus_v1.1.0.ipa Payload
        cd ..
        ls -la OneWhamScale_TinderPlus_v1.1.0.ipa
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: OneWhamScale_TinderPlus_v1.1.0.ipa
        tag_name: v1.1.0-${{ github.run_number }}
        name: OneWhamScale v1.1.0 Build ${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
